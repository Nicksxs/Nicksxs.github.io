<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <rect x="70" y="60" width="1460" height="780" rx="36" fill="#ffffff" stroke="#dfe5ef" stroke-width="3"/>
  <text x="120" y="145" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">我写稿时账号里看到的骑行卡</text>
  <text x="120" y="200" fill="#657085" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28">只记录一次个人页面，不代表全国统一价格</text>

  <rect x="120" y="260" width="420" height="350" rx="28" fill="#fff6e7"/>
  <text x="160" y="330" fill="#bf6500" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">美团</text>
  <text x="160" y="410" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="68" font-weight="700">16.8 元</text>
  <text x="160" y="458" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30">连续包月</text>
  <line x1="160" y1="505" x2="500" y2="505" stroke="#e7c98d" stroke-width="2"/>
  <text x="160" y="558" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">还要看自动续费、每天次数</text>

  <rect x="590" y="260" width="420" height="350" rx="28" fill="#eefbf5"/>
  <text x="630" y="330" fill="#137a52" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">青桔</text>
  <text x="630" y="405" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="47" font-weight="700">低频卡 / 包月</text>
  <text x="630" y="458" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30">按当时页面选择</text>
  <line x1="630" y1="505" x2="970" y2="505" stroke="#a7dfc5" stroke-width="2"/>
  <text x="630" y="558" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">本文不写成固定全国价</text>

  <rect x="1060" y="260" width="420" height="350" rx="28" fill="#eef4ff"/>
  <text x="1100" y="330" fill="#2667b8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">哈啰</text>
  <text x="1100" y="402" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">24.99 元</text>
  <text x="1100" y="448" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28">30 天单车月卡</text>
  <text x="1100" y="502" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600">3.5 元 + 0.99 元/单</text>
  <text x="1100" y="548" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">低频卡有效期 15 天</text>

  <rect x="120" y="665" width="1360" height="105" rx="22" fill="#172033"/>
  <text x="160" y="730" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="600">别只看购卡价：有效期、每单费用、免费时长和自动续费要一起核对</text>
</svg>
