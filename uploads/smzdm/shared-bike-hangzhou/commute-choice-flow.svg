<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7e8aa0"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7fb"/>
  <text x="800" y="120" text-anchor="middle" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="700">固定通勤路线，买卡前先过 4 关</text>
  <text x="800" y="174" text-anchor="middle" fill="#657085" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28">这是选择顺序，不是三家在所有城区的统一排名</text>

  <rect x="90" y="300" width="310" height="300" rx="32" fill="#fff7e8" stroke="#f1c46c" stroke-width="3"/>
  <circle cx="245" cy="366" r="42" fill="#f5a623"/>
  <text x="245" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="700">1</text>
  <text x="245" y="458" text-anchor="middle" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">先看有没有车</text>
  <text x="245" y="515" text-anchor="middle" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">家门口、公司和接驳点</text>
  <text x="245" y="553" text-anchor="middle" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">分早晚各看几次</text>

  <line x1="420" y1="450" x2="500" y2="450" stroke="#7e8aa0" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="510" y="300" width="310" height="300" rx="32" fill="#edf7ff" stroke="#83bee9" stroke-width="3"/>
  <circle cx="665" cy="366" r="42" fill="#2f80c9"/>
  <text x="665" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="700">2</text>
  <text x="665" y="458" text-anchor="middle" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">再试开锁流程</text>
  <text x="665" y="515" text-anchor="middle" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">扫码后能不能直接走</text>
  <text x="665" y="553" text-anchor="middle" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">赶时间时最有感</text>

  <line x1="840" y1="450" x2="920" y2="450" stroke="#7e8aa0" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="930" y="300" width="310" height="300" rx="32" fill="#eefaf5" stroke="#82d0ad" stroke-width="3"/>
  <circle cx="1085" cy="366" r="42" fill="#2a9d68"/>
  <text x="1085" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="700">3</text>
  <text x="1085" y="458" text-anchor="middle" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">调几次座椅</text>
  <text x="1085" y="515" text-anchor="middle" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">扳手阻力和车况</text>
  <text x="1085" y="553" text-anchor="middle" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25">比参数表更直接</text>

  <line x1="1250" y1="450" x2="1318" y2="450" stroke="#7e8aa0" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="1328" y="300" width="182" height="300" rx="32" fill="#f6efff" stroke="#c7a7ea" stroke-width="3"/>
  <circle cx="1419" cy="366" r="42" fill="#8f5bc1"/>
  <text x="1419" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="700">4</text>
  <text x="1419" y="452" text-anchor="middle" fill="#172033" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">算卡价</text>
  <text x="1419" y="510" text-anchor="middle" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23">有效期</text>
  <text x="1419" y="548" text-anchor="middle" fill="#4c596e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23">单次费用</text>

  <rect x="250" y="690" width="1100" height="100" rx="26" fill="#172033"/>
  <text x="800" y="753" text-anchor="middle" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="600">先选在你的路线里好用的，再比较月卡便宜几块钱</text>
</svg>
