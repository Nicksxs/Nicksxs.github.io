<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <text x="100" y="104" fill="#172033" font-size="52" font-weight="700" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">赶时间时，扫码后还要做几步？</text>
  <text x="100" y="154" fill="#64748b" font-size="25" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">按作者近期在杭州城西的实际使用体验整理</text>

  <rect x="100" y="215" width="1400" height="150" rx="28" fill="#fff7df"/>
  <circle cx="176" cy="290" r="40" fill="#f5b800"/>
  <text x="176" y="300" text-anchor="middle" fill="#172033" font-size="26" font-weight="700" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">美团</text>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" fill="#172033">
    <rect x="270" y="255" width="190" height="70" rx="18" fill="#ffffff"/><text x="365" y="299" text-anchor="middle">扫码</text>
    <text x="490" y="300" fill="#94a3b8">→</text>
    <rect x="535" y="255" width="190" height="70" rx="18" fill="#ffffff"/><text x="630" y="299" text-anchor="middle">开锁</text>
    <text x="755" y="300" fill="#94a3b8">→</text>
    <rect x="800" y="255" width="190" height="70" rx="18" fill="#ffffff"/><text x="895" y="299" text-anchor="middle">骑行</text>
    <text x="1020" y="300" fill="#94a3b8">→</text>
    <rect x="1065" y="255" width="190" height="70" rx="18" fill="#ffffff"/><text x="1160" y="299" text-anchor="middle">关锁</text>
    <text x="1285" y="300" fill="#94a3b8">→</text>
    <rect x="1330" y="255" width="120" height="70" rx="18" fill="#ffffff"/><text x="1390" y="299" text-anchor="middle">广告</text>
  </g>

  <rect x="100" y="395" width="1400" height="150" rx="28" fill="#e7fbf3"/>
  <circle cx="176" cy="470" r="40" fill="#35c89a"/>
  <text x="176" y="480" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">青桔</text>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" fill="#172033">
    <rect x="350" y="435" width="240" height="70" rx="18" fill="#ffffff"/><text x="470" y="479" text-anchor="middle">扫码</text>
    <text x="640" y="480" fill="#94a3b8">→</text>
    <rect x="700" y="435" width="240" height="70" rx="18" fill="#ffffff"/><text x="820" y="479" text-anchor="middle">开锁</text>
    <text x="990" y="480" fill="#94a3b8">→</text>
    <rect x="1050" y="435" width="240" height="70" rx="18" fill="#ffffff"/><text x="1170" y="479" text-anchor="middle">骑行</text>
  </g>

  <rect x="100" y="575" width="1400" height="170" rx="28" fill="#eaf3ff"/>
  <circle cx="176" cy="660" r="40" fill="#3478f6"/>
  <text x="176" y="670" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">哈啰</text>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" fill="#172033">
    <rect x="270" y="625" width="180" height="70" rx="18" fill="#ffffff"/><text x="360" y="669" text-anchor="middle">扫码</text>
    <text x="472" y="670" fill="#94a3b8">→</text>
    <rect x="515" y="625" width="190" height="70" rx="18" fill="#ffffff"/><text x="610" y="669" text-anchor="middle">广告</text>
    <text x="727" y="670" fill="#94a3b8">→</text>
    <rect x="770" y="625" width="210" height="70" rx="18" fill="#ffffff"/><text x="875" y="669" text-anchor="middle">处理广告</text>
    <text x="1002" y="670" fill="#94a3b8">→</text>
    <rect x="1045" y="625" width="210" height="70" rx="18" fill="#ffffff"/><text x="1150" y="669" text-anchor="middle">滑动确认</text>
    <text x="1277" y="670" fill="#94a3b8">→</text>
    <rect x="1320" y="625" width="140" height="70" rx="18" fill="#ffffff"/><text x="1390" y="669" text-anchor="middle">开锁</text>
  </g>

  <text x="100" y="820" fill="#64748b" font-size="23" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">* App 版本、账号与活动可能改变页面流程，图中不代表全部用户。</text>
</svg>
