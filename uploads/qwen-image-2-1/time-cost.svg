<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172e"/>
      <stop offset="1" stop-color="#132b4c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="96" y="116" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="52" font-weight="700">一张图的时间花在哪里</text>
  <text x="96" y="168" fill="#a8cce8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26">40 步不是把整条流水线重复 40 次，主要重复的是中间的 DiT 生成计算</text>

  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <rect x="104" y="300" width="250" height="250" rx="28" fill="#113456" stroke="#55cde9" stroke-width="3"/>
    <text x="229" y="385" fill="#fff" font-size="33" font-weight="700" text-anchor="middle">文本编码</text>
    <text x="229" y="445" fill="#b7d9ed" font-size="26" text-anchor="middle">通常 1 次</text>
    <text x="229" y="493" fill="#75e3ff" font-size="24" text-anchor="middle">理解提示词</text>

    <rect x="430" y="244" width="735" height="362" rx="32" fill="#1e2c63" stroke="#8a7fff" stroke-width="4"/>
    <text x="798" y="323" fill="#fff" font-size="38" font-weight="700" text-anchor="middle">DiT 生成主干</text>
    <g fill="#6458d5">
      <rect x="500" y="382" width="66" height="78" rx="12"/>
      <rect x="580" y="382" width="66" height="78" rx="12"/>
      <rect x="660" y="382" width="66" height="78" rx="12"/>
      <rect x="740" y="382" width="66" height="78" rx="12"/>
      <rect x="820" y="382" width="66" height="78" rx="12"/>
      <rect x="900" y="382" width="66" height="78" rx="12"/>
    </g>
    <text x="1003" y="435" fill="#c8c3ff" font-size="34">… × 40</text>
    <text x="798" y="522" fill="#d7d4ff" font-size="26" text-anchor="middle">每一步都可能伴随权重搬入、计算和移出</text>

    <rect x="1240" y="300" width="256" height="250" rx="28" fill="#163d4d" stroke="#62dfbd" stroke-width="3"/>
    <text x="1368" y="385" fill="#fff" font-size="33" font-weight="700" text-anchor="middle">VAE 解码</text>
    <text x="1368" y="445" fill="#c2eadf" font-size="26" text-anchor="middle">通常 1 次</text>
    <text x="1368" y="493" fill="#70e2bf" font-size="24" text-anchor="middle">还原像素图</text>

    <rect x="166" y="696" width="1268" height="100" rx="26" fill="#0b213b" stroke="#365d82"/>
    <text x="800" y="742" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">作者实测：RTX 3060 6GB + 32GB 内存，1024×1024、40 步，复杂提示词约 40 分钟</text>
    <text x="800" y="779" fill="#a8cce8" font-size="23" text-anchor="middle">单次观察，不代表同型号机器的固定成绩</text>
  </g>
</svg>
