<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172e"/>
      <stop offset="1" stop-color="#142b4d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#54d6ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="96" y="116" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="52" font-weight="700">选了 Fast FP8，为什么运行时还能看到 BF16</text>
  <text x="96" y="168" fill="#a8cce8" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26">模型名称、组件权重和实际加载精度是三层信息，判断时以 Loaded build 为准</text>

  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <rect x="96" y="260" width="390" height="370" rx="30" fill="#102e4e" stroke="#4b7ca6" stroke-width="3"/>
    <text x="291" y="326" fill="#8ddfff" font-size="26" text-anchor="middle">模型选择器</text>
    <rect x="142" y="374" width="298" height="94" rx="20" fill="#183d63"/>
    <text x="291" y="430" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">Fast FP8</text>
    <text x="291" y="523" fill="#bad5e9" font-size="24" text-anchor="middle">说明仓库或配方提供 FP8 路径</text>
    <text x="291" y="564" fill="#bad5e9" font-size="24" text-anchor="middle">不代表每个组件都按 FP8 计算</text>

    <rect x="605" y="224" width="430" height="446" rx="32" fill="#173657" stroke="#66d9ff" stroke-width="4"/>
    <text x="820" y="294" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Loaded build</text>
    <rect x="662" y="344" width="316" height="82" rx="18" fill="#0c243e"/>
    <text x="698" y="396" fill="#a8cce8" font-size="25">Transformer</text>
    <text x="935" y="396" fill="#ffbf69" font-size="29" font-weight="700" text-anchor="end">BF16</text>
    <rect x="662" y="449" width="316" height="82" rx="18" fill="#0c243e"/>
    <text x="698" y="501" fill="#a8cce8" font-size="25">Text encoder</text>
    <text x="935" y="501" fill="#64e2bd" font-size="29" font-weight="700" text-anchor="end">FP8</text>
    <text x="820" y="593" fill="#d7ebfa" font-size="25" text-anchor="middle">这里才是本次实际加载结果</text>

    <rect x="1154" y="260" width="350" height="370" rx="30" fill="#24275a" stroke="#8d83ff" stroke-width="3"/>
    <text x="1329" y="326" fill="#c8c3ff" font-size="26" text-anchor="middle">这台 RTX 3060</text>
    <text x="1329" y="412" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">主生成器仍是 BF16</text>
    <text x="1329" y="470" fill="#d6d4ff" font-size="24" text-anchor="middle">权重更大、搬运更多</text>
    <text x="1329" y="515" fill="#d6d4ff" font-size="24" text-anchor="middle">6GB 显存下等待更明显</text>
    <rect x="1214" y="551" width="230" height="48" rx="24" fill="#594fd2"/>
    <text x="1329" y="583" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">重载后再核对</text>
  </g>

  <path d="M505 446H579" stroke="#54d6ff" stroke-width="9" marker-end="url(#arrow)"/>
  <path d="M1054 446H1128" stroke="#54d6ff" stroke-width="9" marker-end="url(#arrow)"/>
  <rect x="214" y="728" width="1172" height="84" rx="24" fill="#0b213b" stroke="#365d82"/>
  <text x="800" y="781" fill="#d4ebff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" text-anchor="middle">结论：列表里的 FP8 是入口标签，Loaded build 才能回答“这一次实际跑的是什么”</text>
</svg>
